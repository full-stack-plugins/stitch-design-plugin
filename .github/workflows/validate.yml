name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-offline:
    name: Offline gates (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate distribution
        run: python scripts/validate_distribution.py .
      - name: Validate all Skills
        run: python scripts/validate_skills.py skills
      - name: Validate Markdown links
        run: python scripts/validate_markdown_links.py .
      - name: Scan for secrets
        run: python scripts/scan_secrets.py .
      - name: Compile Python sources
        run: python -m compileall -q scripts stitch_harness skills
      - name: Validate launcher syntax
        run: node --check scripts/stitch_mcp_launcher.js
      - name: Install ShellCheck on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Run ShellCheck
        run: find scripts skills -type f -name '*.sh' -exec shellcheck {} +
  windows-offline:
    name: Windows gates (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate distribution
        run: python scripts/validate_distribution.py .
      - name: Validate all Skills
        run: python scripts/validate_skills.py skills
      - name: Validate Markdown links
        run: python scripts/validate_markdown_links.py .
      - name: Scan for secrets
        run: python scripts/scan_secrets.py .
      - name: Compile Python sources
        run: python -m compileall -q scripts stitch_harness skills
      - name: Validate launcher syntax
        run: node --check scripts/stitch_mcp_launcher.js
      - name: Smoke-test configured stdio launcher
        shell: pwsh
        run: |
          $config = Get-Content .mcp.json -Raw | ConvertFrom-Json
          $server = $config.mcpServers.stitch
          $launcherArgs = @($server.args)
          Push-Location $server.cwd
          try {
            $output = '{invalid-json' | & $server.command @launcherArgs
            if ($LASTEXITCODE -ne 0) { throw "launcher exited with $LASTEXITCODE" }
            if ($output -notmatch '"code":-32700') { throw "launcher did not return a JSON-RPC parse error" }
          } finally {
            Pop-Location
          }
