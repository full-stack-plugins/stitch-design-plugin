name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix-offline:
    name: Offline gates (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate distribution
        run: python scripts/validate_distribution.py .
      - name: Validate all Skills
        run: python scripts/validate_skills.py skills
      - name: Validate Markdown links
        run: python scripts/validate_markdown_links.py .
      - name: Scan for secrets
        run: python scripts/scan_secrets.py .
      - name: Compile Python sources
        run: python -m compileall -q scripts stitch_harness skills
      - name: Verify configured MCP command
        run: python scripts/smoke_mcp_config.py --expected-python "${{ matrix.python-version }}"
      - name: Install ShellCheck on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Run ShellCheck
        run: find scripts skills -type f -name '*.sh' -exec shellcheck {} +
  windows-offline:
    name: Windows gates (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate distribution
        run: python scripts/validate_distribution.py .
      - name: Validate all Skills
        run: python scripts/validate_skills.py skills
      - name: Validate Markdown links
        run: python scripts/validate_markdown_links.py .
      - name: Scan for secrets
        run: python scripts/scan_secrets.py .
      - name: Compile Python sources
        run: python -m compileall -q scripts stitch_harness skills
      - name: Verify configured MCP command
        run: python scripts/smoke_mcp_config.py --expected-python "${{ matrix.python-version }}"
